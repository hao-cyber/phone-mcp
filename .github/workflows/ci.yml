name: Screenshot and installation regressions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regressions:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11']
        include:
          - os: ubuntu-latest
            python: '3.10'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv
      - name: Test screenshots and installed CLI/MCP entry points
        run: uv run --no-project --with . --with pytest==8.3.5 --with pytest-asyncio==0.26.0 python -m pytest tests/test_screen_interface.py tests/test_installation.py -q
